spring.application.name=user-service
spring.config.import=optional:classpath:secrets.properties
#spring.datasource.url=jdbc:postgresql://ep-wandering-heart-an6o3o6w-pooler.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.jpa.hibernate.ddl-auto=none
spring.output.ansi.enabled=ALWAYS
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.test-on-borrow=true
